name: IMPACT checks

on:
  push:
    paths:
      - "app/**"
      - "data/schema/**"
      - ".github/workflows/checks.yml"
  pull_request:
    paths:
      - "app/**"
      - "data/schema/**"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install app dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        working-directory: app
        run: npm run typecheck

      - name: Run unit tests
        working-directory: app
        run: npm run test

      - name: Test service worker offline behaviour
        run: node scripts/test-service-worker.mjs

      - name: Build production app
        working-directory: app
        run: npm run build

      - name: Check data schemas and editorial invariants
        run: node scripts/check-schemas.mjs
