name: IMPACT checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install app dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        working-directory: app
        run: npm audit --audit-level=high

      - name: Check TypeScript
        working-directory: app
        run: npm run typecheck

      - name: Run unit tests
        working-directory: app
        run: npm run test

      - name: Test service worker offline behaviour
        run: node scripts/test-service-worker.mjs

      - name: Test editorial data integrity validator
        run: node --test scripts/test-data-integrity.test.mjs

      - name: Test JSON Schema validation
        run: node --test scripts/test-schema-validation.test.mjs

      - name: Check secondary text contrast
        run: node scripts/check-contrast.mjs

      - name: Check UI invariants
        run: node scripts/check-ui-invariants.mjs

      - name: Build production app
        working-directory: app
        run: npm run build

      - name: Check PWA production package
        run: node scripts/check-pwa-build.mjs

      - name: Check data schemas and editorial invariants
        run: node scripts/check-schemas.mjs

      - name: Check editorial data references
        run: node scripts/check-data.mjs
