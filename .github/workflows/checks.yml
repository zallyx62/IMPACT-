name: IMPACT checks

on:
  push:
    paths:
      - "app/**"
      - "data/schema/**"
      - ".github/workflows/checks.yml"
  pull_request:
    paths:
      - "app/**"
      - "data/schema/**"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install app dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        working-directory: app
        run: npm run typecheck

      - name: Build production app
        working-directory: app
        run: npm run build

      - name: Check data schemas are valid JSON
        run: |
          node -e "for (const file of ['data/schema/claim.schema.json', 'data/schema/source.schema.json']) { JSON.parse(require('node:fs').readFileSync(file, 'utf8')); console.log('Valid JSON:', file); }"
