name: IMPACT Android build

on:
  push:
    paths:
      - "app/**"
      - "android/**"
      - "scripts/test-android-wrapper.mjs"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "android/**"
      - "scripts/test-android-wrapper.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Android debug and release builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Build the Web app and copy its production assets
        run: sh android/scripts/build-web-assets.sh

      - name: Test Android wrapper security invariants
        run: node scripts/test-android-wrapper.mjs

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Build Android debug and release APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Verify APK outputs
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Android debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: impact-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
