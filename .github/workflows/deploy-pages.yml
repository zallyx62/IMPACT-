name: Deploy IMPACT Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "data/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_enabled: ${{ github.event.repository.has_pages }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        working-directory: app
        run: npm run typecheck

      - name: Run application tests
        working-directory: app
        run: npm test

      - name: Check contrast and UI invariants
        run: |
          node scripts/check-contrast.mjs
          node scripts/check-ui-invariants.mjs

      - name: Build production Web app
        working-directory: app
        run: npm run build

      - name: Add GitHub Pages marker
        run: touch app/dist/.nojekyll

      - name: Upload production site
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    name: Publish Web app
    needs: build
    if: needs.build.outputs.pages_enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
