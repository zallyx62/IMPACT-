name: IMPACT checks

on:
  push:
    paths:
      - "app/**"
      - "data/schema/**"
      - ".github/workflows/checks.yml"
  pull_request:
    paths:
      - "app/**"
      - "data/schema/**"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-quality:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install app dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Commit generated npm lockfile once
        if: github.event_name == 'pull_request' && github.head_ref == 'build/export-lockfile'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add generated npm lockfile"
            git push origin HEAD:build/export-lockfile
          fi

      - name: Export generated npm lockfile once
        if: github.event_name == 'pull_request' && github.head_ref == 'build/export-lockfile'
        uses: actions/upload-artifact@v4
        with:
          name: impact-npm-lockfile
          path: app/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Check TypeScript
        working-directory: app
        run: npm run typecheck

      - name: Run unit tests
        working-directory: app
        run: npm run test

      - name: Test service worker offline behaviour
        run: node scripts/test-service-worker.mjs

      - name: Check secondary text contrast
        run: node scripts/check-contrast.mjs

      - name: Build production app
        working-directory: app
        run: npm run build

      - name: Check data schemas and editorial invariants
        run: node scripts/check-schemas.mjs
