name: IMPACT checks

on:
  push:
    paths:
      - "app/**"
      - "data/schema/**"
      - "scripts/**"
      - ".github/workflows/checks.yml"
  pull_request:
    paths:
      - "app/**"
      - "data/schema/**"
      - "scripts/**"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install app dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Commit regenerated npm lockfile once
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/full-json-schema-validation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add Ajv schema validation dependencies"
            LOCK_COMMIT=$(git rev-parse HEAD)
            git fetch origin feat/full-json-schema-validation
            git switch --create lockfile-export origin/feat/full-json-schema-validation
            git cherry-pick "$LOCK_COMMIT"
            git push origin HEAD:feat/full-json-schema-validation
          fi

      - name: Audit dependencies
        working-directory: app
        run: npm audit --audit-level=high

      - name: Check TypeScript
        working-directory: app
        run: npm run typecheck

      - name: Run unit tests
        working-directory: app
        run: npm run test

      - name: Test service worker offline behaviour
        run: node scripts/test-service-worker.mjs

      - name: Test editorial data integrity validator
        run: node --test scripts/test-data-integrity.test.mjs

      - name: Test JSON Schema validation
        run: node --test scripts/test-schema-validation.test.mjs

      - name: Check secondary text contrast
        run: node scripts/check-contrast.mjs

      - name: Build production app
        working-directory: app
        run: npm run build

      - name: Check data schemas and editorial invariants
        run: node scripts/check-schemas.mjs

      - name: Check editorial data references
        run: node scripts/check-data.mjs
